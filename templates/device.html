<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прибор</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="feed-body">
    {% if device %}
    <div class="video-feed">
        <video autoplay loop muted playsinline class="feed-video">
            <source src="{{ device.video_url or '/static/img/default.mp4' }}" type="video/mp4">
        </video>
        
        <div class="feed-bottom">
            <div class="feed-left">
                <img src="{{ device.image_url or '/static/img/default.jpg' }}" 
                     alt="{{ device.device_name }}" 
                     class="feed-device-image">
                
                <h2>{{ device.device_name }}</h2>
                <p class="device-type">{{ device.device_type }}</p>
                
                <p class="description-short" id="desc">{{ device.description }}</p>
                <button class="more-btn" onclick="document.getElementById('desc').classList.toggle('expanded')">
                    Ещё
                </button>
            </div>
            
            <div class="feed-right">
                <div class="feed-params">
                    <span>{{ device.power_consumption }} Вт</span>
                    <span>{{ device.emf_level }} мкВт/см²</span>
                    <span>{{ device.safety_distance }} м</span>
                </div>
                
                <button class="like-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#757575">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                    <span>{{ likes_count }}</span>
                </button>
                
                <a href="/device/{{ device.id }}?next=true" class="next-btn">→</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="not-found">
        <h2>Прибор не найден</h2>
        <a href="/">Вернуться к списку</a>
    </div>
    {% endif %}
    
    <nav class="bottom-nav">
        <a href="/device/1" class="nav-item active">
            <span class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="5" width="14" height="14" rx="3" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 10L22 7V17L16 14" stroke="currentColor" stroke-width="2"/>
                </svg>
            </span>
            <span>Лента</span>
        </a>
        <a href="/draft" class="nav-item">
            <span class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="2"/>
                    <line x1="12" y1="8" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="8" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            <span>Добавить</span>
        </a>
        <a href="/" class="nav-item">
            <span class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                    <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                    <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                    <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                </svg>
            </span>
            <span>Плитка</span>
        </a>
    </nav>
</body>
</html>
