version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emf_postgres
    environment:
      POSTGRES_USER: emf_user
      POSTGRES_PASSWORD: emf_password
      POSTGRES_DB: emf_devices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: emf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:latest
    container_name: emf_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
