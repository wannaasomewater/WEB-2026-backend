services:
  postgres:
    image: postgres:15-alpine
    container_name: electronic_postgres
    environment:
      POSTGRES_USER: electronic_user
      POSTGRES_PASSWORD: electronic_password
      POSTGRES_DB: electronic_devices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: electronic_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    container_name: electronic_minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
