services:
  postgres:
    image: postgres:15-alpine
    container_name: electrical_postgres
    environment:
      POSTGRES_USER: electrical_user
      POSTGRES_PASSWORD: electrical_password
      POSTGRES_DB: electrical_appliances_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: electrical_adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: electrical_seaweedfs
    ports:
      - "9100:8333"
      - "9101:9333"
      - "9102:8888"
    volumes:
      - seaweedfs_data:/data
    command: "server -dir=/data -s3 -s3.port=8333 -master.port=9333 -filer -filer.port=8888 -volume.max=100"

  redis:
    image: redis:7-alpine
    container_name: electrical_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  seaweedfs_data:
  redis_data:
