services:
  postgres:
    image: postgres:15-alpine
    container_name: electrical_postgres
    environment:
      POSTGRES_USER: electrical_user
      POSTGRES_PASSWORD: electrical_password
      POSTGRES_DB: electrical_appliances_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: electrical_adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: electrical_minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
